name: Refresh box office data

on:
  schedule:
    # Weekend numbers land Sunday/Monday; refresh daily at 13:00 UTC to catch revisions.
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scrape latest weekend chart
        run: node scripts/refresh-data.mjs

      - name: Commit if the data changed
        run: |
          if git diff --quiet -- data/boxoffice.json; then
            echo "No change in box office data."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/boxoffice.json
          git commit -m "Update box office data"
          git push
